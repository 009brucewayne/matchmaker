<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matchmaker</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--burgundy:#800020;--head:#5a0016;--gold:#C9A84C;--bg:#ffffff;--card:#f4f1f1;--text:#1a1410;--muted:#5a4a3a;--line:#ddd3d3;--ok:#1f7a3a;--bad:#b00020}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121012;--card:#1f1b1d;--text:#f2ecec;--muted:#c4b5b5;--line:#3a3034;--burgundy:#c23a5a;--ok:#2e8a4c;--bad:#c0283e}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.4;padding:0 16px 170px;max-width:560px;margin:0 auto}
header{background:var(--head);color:#fff;margin:0 -16px 16px;padding:20px 16px 18px;border-bottom:4px solid var(--gold)}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:26px;line-height:1.15}
.team{color:var(--gold);font-weight:600;margin-top:6px;font-size:16px}
.intro{margin:0 0 14px}
ul{list-style:none}
li{margin:0 0 8px}
label{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;min-height:56px;-webkit-tap-highlight-color:transparent}
input[type=checkbox]{width:26px;height:26px;flex:0 0 26px;accent-color:var(--burgundy)}
.q{flex:1;min-width:0}
.q b{display:block}
.q span{display:block;color:var(--muted);font-size:15px}
.price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
label.on{border-color:var(--burgundy)}
h2{font-family:'Playfair Display',Georgia,serif;font-size:19px;margin:20px 0 8px}
textarea{width:100%;min-height:110px;font:inherit;font-size:17px;padding:10px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.reset{margin:16px 0;background:none;border:2px solid var(--line);color:var(--muted);font:inherit;padding:10px 14px;border-radius:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--head);color:#fff;border-top:4px solid var(--gold);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar div{max-width:528px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bar .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bar .msg{font-size:15px;width:100%}
.bar.ok{background:var(--ok)}
.bar.over{background:var(--bad)}
.track{width:100%;height:10px;background:rgba(255,255,255,.25);border-radius:5px;overflow:hidden;margin-top:6px}
.fill{height:100%;width:0;background:var(--gold);transition:width .25s ease}
.bar.ok .fill{background:#fff}
.bar.over .fill{background:#ffd0d6}
.see{display:none;background:#fff;color:var(--ok);border:0;font:inherit;font-weight:700;padding:6px 12px;border-radius:6px}
.bar.ok .see{display:inline-block}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
.veil{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;align-items:center;justify-content:center;padding:16px}
.veil.show{display:flex}
.card{background:var(--bg);color:var(--text);width:100%;max-width:440px;max-height:90vh;overflow:auto;border-radius:10px;border-top:6px solid var(--gold)}
.card h3{font-family:'Playfair Display',Georgia,serif;font-size:24px;background:var(--head);color:#fff;padding:16px}
.card ul{padding:12px 16px}
.card li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0;margin:0}
.card .sum{font-weight:700;border-bottom:0}
.card .keep{display:block;width:calc(100% - 32px);margin:0 16px 16px;background:var(--head);color:#fff;border:0;font:inherit;padding:12px;border-radius:8px}
.go{display:block;background:var(--head);color:#fff;text-decoration:none;font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:900;padding:22px 16px;border-radius:8px;border-bottom:4px solid var(--gold);margin:0 0 14px}.go span{display:block;font-family:'Source Serif 4',Georgia,serif;font-weight:400;font-size:16px;color:#fff;opacity:.9}.go.boys{background:#1d4e89}.go.girls{background:#b03a68}</style></head><body>
<header><h1>Matchmaker: The $1,500 Challenge</h1></header>
<p class="intro">Pick your team.</p>
<a class="go boys" href="boys.html">Boys<span>The $1,500 Future Wife</span></a>
<a class="go girls" href="girls.html">Girls<span>The $1,500 Future Husband</span></a>
</body></html>
